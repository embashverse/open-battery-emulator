[project]
name = "open-battery-emulator"
version = "1.0.0"
description = "A battery pack in software for the Raspberry Pi, with BMS style data on CAN."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cantools>=45.2.0",
    "pyserial>=3.5",
    "python-can>=4.6.1",
    "ruamel-yaml>=0.19.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
docs = [
    "mkdocs-material>=9.8.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Do not auto-load pytest plugins from installed packages (for example ROS ones on
# PYTHONPATH). This project uses no plugins, so nothing is lost.
addopts = "--disable-plugin-autoload"
