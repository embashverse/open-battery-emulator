name: Docs

# Builds the documentation site and publishes it on GitHub Pages:
# https://embashverse.github.io/open-battery-emulator/
# Runs on every push to main, and by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what Pages needs: read the code, write to Pages, and an ID token that proves
# the deploy comes from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once. A new run waits for the one in progress to finish
# instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Build docs (fails on broken links or pages missing from the navigation)
        run: uv run --group docs mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
